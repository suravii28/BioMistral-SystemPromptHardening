  ${t===1&&html`<div><p class="sub" style=${{margin:'0 0 8px'}}>The false premise is wrapped in a social cue. Type any wrong answer to see the exact message the model receives.</p><input class="txt" value=${v} onInput=${e=>setV(e.target.value)} aria-label="Wrong answer"/><div class="pills">${TP.map((r,k)=>html`<button class=${'pill'+(q===k?' on':'')} onClick=${()=>setQ(k)}>${r[0]}</button>`)}</div><div class="pre">${tp[0]}<b style=${{color:'var(--rs)'}}>${v||'...'}</b>${tp[1]}</div></div>`}
  ${t===2&&html`<div><p class="sub" style=${{margin:'0 0 8px'}}>BioMistral uses the Mistral instruction format. A helper rebuilds the whole multi-turn history in this shape for every call, with the system prompt only in the first turn.</p><div class="pre">${FMT}</div></div>`}
  ${t===3&&html`<div><p class="sub" style=${{margin:'0 0 8px'}}>Fix F3 runs the model twice per token, once with the Defender prompt and once with the Villain prompt, then subtracts. Try it with toy numbers (not real model output).</p><div class="pre">${CD}</div><div class="lab"><input type="range" min="0" max="1" step="0.01" value=${a} onInput=${e=>setA(+e.target.value)} aria-label="alpha"/><div class="val">α = ${a.toFixed(2)}</div></div>${T.map((r,k)=>html`<div class="row" style=${{gridTemplateColumns:'190px 1fr 60px'}}><div class="nm">${w===k?I('Check',{size:16,color:'var(--ac)'}):null}${r[0]}</div><${Bar} v=${r[1]} max=${3} color=${w===k?'var(--ac)':'var(--ac2)'}/><div class="val">${r[1].toFixed(2)}</div></div>`)}<p class="sub" style=${{margin:0}}>${w===1?'The pressured model would have said yes. Subtracting the sycophantic voice lets the correction win.':'At α near 0 the pressured model agrees. Raise α to flip it.'}</p></div>`}
  ${t===4&&html`<div><div class="pills">${STK.map(([ic,n])=>html`<span class="chip">${I(ic,{size:14})}${n}</span>`)}</div><div class="eng">${ENG.map(([ic,h,d])=>html`<div>${I(ic,{size:18})}<span><b>${h}</b>${d}</span></div>`)}</div></div>`}
  </div></section>`}
const SORTS={gain:(a,b)=>b[2]-a[2],size:(a,b)=>b[1]-a[1],name:(a,b)=>a[0].localeCompare(b[0])};
function App(){
  const [s,setS]=useState(0), [tab,setTab]=useState('all'), [sel,setSel]=useState(1), [sort,setSort]=useState('gain'), [play,setPlay]=useState(false), [th,setTh]=useState(window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  useEffect(()=>{document.documentElement.dataset.theme=th},[th]);
  useEffect(()=>{if(!play)return;const id=setInterval(()=>setS(x=>(x+1)%5),1800);return()=>clearInterval(id)},[play]);
  const cur=M[tab], best=Math.max(...cur.rows.map(r=>r[1]));
  return html`<div class="wrap">
    <div class="top">
      <div class="brand"><i>${I('ShieldCheck',{size:22})}</i>Resisting Adversarial Influence in Generative AI</div>
      <div class="chips">
        <span class="chip">${I('Cpu',{size:14})} Tesla T4</span>
        <span class="chip">${I('Clock',{size:14})} 6.35 h runtime</span>
        <button class="iconbtn" onClick=${()=>setTh(th==='dark'?'light':'dark')} aria-label="Toggle theme">${I(th==='dark'?'Sun':'Moon',{size:14})} ${th==='dark'?'Light':'Dark'}</button>
        <span class="chip">${I('FlaskConical',{size:14})} 250 trials · 5 turns</span>
      </div>
    </div>

    <div class="hero">
      <div class="med" aria-hidden="true">${['HeartPulse','Stethoscope','Pill','Syringe','Microscope','Dna','Brain','Thermometer'].map(n=>html`<i>${I(n,{size:22})}</i>`)}</div>
      <h1>Does a medical AI hold its ground when someone pushes back?</h1>
      <p>We pressured BioMistral-7B with false claims from fake authorities, then tested two ways to make it stand firm.</p>
    </div>

    <${Funnel}/><div class="grid g4">
      ${STATS.map(([ic,v,l,c])=>html`<div class="card stat"><div class="ic" style=${{color:c}}>${I(ic,{size:22})}</div><b><${CountUp} v=${v}/></b><span>${l}</span></div>`)}
    </div>

    <section>
      <div class="sh">${I('MessagesSquare',{size:24})}<h2>How each trial works</h2></div>
      <p class="sub">Tap a turn to see what happens in the conversation.</p>
      <div class="steps">${STEPS.map((x,i)=>html`<button class=${'step'+(s===i?' on':'')} onClick=${()=>setS(i)}><b>${x.t}</b><small>${x.l}</small></button>`)}</div>
      <div class="card"><div style=${{display:'flex',justifyContent:'space-between',alignItems:'center',gap:10,flexWrap:'wrap'}}><div class="say" style=${{minHeight:0,flex:1}}><h3>${STEPS[s].h}</h3><p>${STEPS[s].d}</p></div><button class="iconbtn" onClick=${()=>setPlay(!play)}>${I(play?'Pause':'Play',{size:14})} ${play?'Pause':'Play the conversation'}</button></div><div class="chat">${CH.filter(c=>c[0]<=s).map((c,k)=>html`<div key=${k} class=${'bub '+c[1]}>${c[2]}</div>`)}</div></div>
    </section>

    <section>
      <div class="sh">${I('Sparkles',{size:24})}<h2>Which fix works best?</h2></div>
      <p class="sub">Bars show the average gain in "discrimination", meaning how much closer the answer moves to the correct option and away from the false claim.</p>
      <div class="card">
        <div class="tabs" role="tablist">
          <button class=${'tab'+(tab==='all'?' on':'')} onClick=${()=>setTab('all')}>All gated</button>
          <button class=${'tab'+(tab==='cap'?' on':'')} onClick=${()=>setTab('cap')}>Caved only</button>
        </div>
        <div style=${{color:'var(--mu)',fontSize:14}}>${cur.n}. Tap a method for its statistics.</div>
        <${Detail} t=${tab} i=${sel}/>
        ${cur.rows.map((r,ri)=>html`<div class=${'clk'+(Math.min(sel,cur.rows.length-1)===ri?' sel':'')} role="button" tabindex="0" onClick=${()=>setSel(ri)} onKeyDown=${e=>{if(e.key==='Enter')setSel(ri)}}>
          <div class="row">
            <div class="nm">${r[1]===best?I('Trophy',{size:16,color:'var(--wa)'}):I('Layers',{size:16,color:'var(--mu)'})}${r[0]}</div>
            <${Bar} v=${r[1]} max=${.14} color=${r[1]===best?'var(--ac)':'var(--ac2)'}/>
            <div class="val">${f(r[1])}</div>
          </div>
          <div class="meta" style=${{marginTop:-8}}>
            <span class=${'tag '+(r[3]?'ok':'no')}>${r[3]?'Significant':'Not significant'}</span>
            <span>${r[2]} improved</span><span>${r[4]} per answer</span>
          </div>
        </div>`)}
      </div>
    </section>

    <section>
      <div class="grid g2">
        <div class="card">
          <div class="sh">${I('SlidersHorizontal',{size:22})}<h3 style=${{fontSize:20}}>Tuning contrastive decoding</h3></div>
          <p class="sub" style=${{marginBottom:6}}>Three strengths (α) tested on 5 trials. α = 0.5 won.</p>
          <${AlphaSlider}/>
          ${ALPHA.map(a=>html`<div class="row" style=${{gridTemplateColumns:'70px 1fr 70px'}}>
            <div class="nm">α ${a[0]}</div><${Bar} v=${a[1]} max=${.12} color=${a[0]===.5?'var(--ac)':'var(--ac2)'}/><div class="val">${f(a[1])}</div></div>`)}
        </div>
        <div class="card">
          <div class="sh">${I('Timer',{size:22})}<h3 style=${{fontSize:20}}>What it costs in time</h3></div>
          <p class="sub" style=${{marginBottom:6}}>Seconds per answer. Contrastive decoding runs the model twice per token.</p>
          ${[['Prompt (F1)',12.82],['Contrastive (F3)',19.78],['Both (F1+F3)',23.93]].map(a=>html`<div class="row" style=${{gridTemplateColumns:'110px 1fr 60px'}}>
            <div class="nm">${a[0]}</div><${Bar} v=${a[1]} max=${24} color="var(--wa)"/><div class="val">${a[1]}s</div></div>`)}
        </div>
      </div>
    </section>

    <section>
      <div class="sh">${I('Stethoscope',{size:24})}<h2>Results by medical subject</h2></div>
      <p class="sub">Gain from contrastive decoding. Some specialities benefit a lot, others not at all. Sample sizes are small.</p>
      <div class="card">
        <div class="tabs sm">${[['gain','Biggest gain'],['size','Most trials'],['name','A to Z']].map(([k,l])=>html`<button class=${'tab'+(sort===k?' on':'')} onClick=${()=>setSort(k)}>${l}</button>`)}</div>
        ${[...SUBJ].sort(SORTS[sort]).map(([n,c,v])=>html`<div class="row" key=${n} title=${n+': '+f(v)+' across '+c+' gated trials'}>
          <div class="nm">${I(SI[n],{size:16,color:'var(--ac)'})}${n} <span style=${{color:'var(--mu)',fontWeight:400}}>n=${c}</span></div>
          <${Bar} v=${v} max=${.18} color=${v<0?'var(--rs)':'var(--ac)'}/>
          <div class="val" style=${{color:v<0?'var(--rs)':'var(--tx)'}}>${f(v)}</div></div>`)}
      </div>
    </section>

    <section>
      <div class="sh">${I('GraduationCap',{size:24})}<h2>Key takeaways</h2></div>
      <div class="grid g2" style=${{marginTop:16}}>
        <div class="card win take">${I('CheckCircle2',{size:22,color:'var(--ac)'})}<div><h3>Contrastive decoding wins</h3><p>Best average gain (+0.060 overall, +0.122 on trials that caved), and statistically significant.</p></div></div>
        <div class="card take">${I('AlertTriangle',{size:22,color:'var(--wa)'})}<div><h3>Combining fixes backfires</h3><p>Prompt plus contrastive was weaker than contrastive alone and not significant (interaction −0.061).</p></div></div>
        <div class="card take">${I('Zap',{size:22,color:'var(--wa)'})}<div><h3>Speed trade-off</h3><p>Contrastive decoding takes about 1.5× longer per answer than the prompt fix.</p></div></div>
        <div class="card take">${I('Info',{size:22,color:'var(--mu)'})}<div><h3>Modest and uneven</h3><p>Gains are small, and Medicine and Surgery saw little or none. A larger study is needed.</p></div></div>
      </div>
    </section>

    <${Code}/>
    <footer>BioMistral/BioMistral-7B · MedMCQA · 13 clinical subjects · greedy decoding · results from the Kaggle run</footer>
  </div>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
